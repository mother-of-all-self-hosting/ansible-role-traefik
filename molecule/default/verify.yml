---
- name: Verify Traefik systemd service
  hosts: all
  become: true
  gather_facts: false

  vars:
    traefik_verify_units:
      - traefik.service

  tasks:
    - name: Verify that Traefik works
      block:
        # The systemd unit only reaches 'active' after its ExecStartPost healthcheck
        # got an answer from Traefik's /ping endpoint, so 'active' already implies
        # that Traefik is up and its static configuration parsed.
        - name: Wait for the Traefik systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: traefik_services
          until: traefik_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ traefik_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Traefik systemd services are active
          ansible.builtin.assert:
            that: traefik_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(traefik_verify_units | zip(traefik_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Traefik systemd services log for debugging
          when: traefik_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ traefik_verify_units }}"

        - name: Ensure the web entrypoint answers (404 for an unknown host)
          ansible.builtin.uri:
            url: "http://localhost:80/"
            method: GET
            headers:
              Host: unknown.example.com
            status_code: [404]
          register: traefik_web_entrypoint
          until: traefik_web_entrypoint.status == 404
          retries: 12
          delay: 5

        - name: Ensure the dashboard requires authentication
          ansible.builtin.uri:
            url: "http://localhost:80/dashboard/"
            method: GET
            headers:
              Host: localhost
            status_code: [401]

        - name: Query the Traefik API overview
          ansible.builtin.uri:
            url: "http://localhost:80/api/overview"
            method: GET
            headers:
              Host: localhost
            url_username: admin
            url_password: molecule-test
            force_basic_auth: true
            return_content: true
          register: traefik_api_overview

        - name: Assert the Docker and file providers are enabled
          ansible.builtin.assert:
            that:
              - "'Docker' in traefik_api_overview.json.providers"
              - "'File' in traefik_api_overview.json.providers"
            fail_msg: "Unexpected providers: {{ traefik_api_overview.json.providers | default([]) }}"
            success_msg: "Docker and file providers are enabled"

        # Routing an actual container through Traefik exercises the Docker
        # provider end-to-end: label discovery on the Docker socket, router and
        # service creation, and proxying.
        # Started via the docker CLI rather than community.docker.docker_container,
        # because the ansible-lint environment used by pre-commit does not have the
        # community.docker collection and would fail the syntax check.
        - name: Start a whoami container attached to the Traefik network
          ansible.builtin.command:
            cmd: >-
              docker run -d --rm
              --name=traefik-molecule-whoami
              --network=traefik
              --label=traefik.enable=true
              --label=traefik.http.routers.molecule-whoami.rule=Host(`whoami.local`)
              --label=traefik.http.routers.molecule-whoami.entrypoints=web
              docker.io/traefik/whoami:latest
          changed_when: true

        - name: Wait for the whoami container to be routed through Traefik
          ansible.builtin.uri:
            url: "http://localhost:80/"
            method: GET
            headers:
              Host: whoami.local
            return_content: true
          register: traefik_whoami_response
          until: traefik_whoami_response.status == 200
          retries: 12
          delay: 5

        - name: Assert the whoami container was served through Traefik
          ansible.builtin.assert:
            that:
              - traefik_whoami_response.status == 200
              - "'Hostname:' in traefik_whoami_response.content"
            fail_msg: "whoami was not served through Traefik ({{ traefik_whoami_response.status | default('no response') }})"
            success_msg: "whoami was served through Traefik"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "traefik_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: traefik_restarts_before
              loop: "{{ traefik_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: traefik_restarts_after
              loop: "{{ traefik_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - traefik_restarts_after.results | map(attribute='status.NRestarts') | list == traefik_restarts_before.results | map(attribute='status.NRestarts') | list
                  - traefik_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in traefik_verify_units | zip(traefik_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in traefik_verify_units | zip(traefik_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in traefik_verify_units | zip(traefik_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Traefik verification summary
          ansible.builtin.debug:
            msg:
              - "Traefik systemd: {% for unit, state in traefik_verify_units | zip(traefik_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Traefik restarts: {% for unit, restarts in traefik_verify_units | zip(traefik_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Traefik Web entrypoint: {{ traefik_web_entrypoint.status }}"
              - "Traefik API providers: {{ traefik_api_overview.json.providers }}"
              - "Traefik Docker provider routing (whoami): {{ traefik_whoami_response.status }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Traefik systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=traefik.service
          register: traefik_service_log
          changed_when: false

        - name: Show the Traefik systemd service log
          ansible.builtin.debug:
            var: traefik_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Traefik verification failed. The systemd service log is printed above."
